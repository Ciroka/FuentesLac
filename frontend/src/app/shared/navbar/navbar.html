
<div class="container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-mark">FL</div>
            <div>
                <h2>Fuente Lac</h2>
            </div>
        </div>

        <div class="menu-section">
            <h4>
                <span>Menu Principal</span>
                <div class="menu-separator"></div>
            </h4>

            <ul class="sidebar-links main-links">
                <li routerLinkActive="active">
                    <a routerLink="/home">
                        <mat-icon aria-hidden="true">speed</mat-icon>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li routerLinkActive="active">
                    <a routerLink="/supplies">
                        <mat-icon aria-hidden="true">water_drop</mat-icon>
                        <span>Insumos</span>
                    </a>
                </li>
                <li routerLinkActive="active">
                    <a routerLink="/products">
                        <mat-icon aria-hidden="true">inventory_2</mat-icon>
                        <span>Productos</span>
                    </a>
                </li>
                <li routerLinkActive="active">
                    <a routerLink="/production">
                        <mat-icon aria-hidden="true">apartment</mat-icon>
                        <span>Producción</span>
                    </a>
                </li>
                <li routerLinkActive="active">
                    <a routerLink="/sales">
                        <mat-icon aria-hidden="true">local_shipping</mat-icon>
                        <span>Ventas</span>
                    </a>
                </li>
                <li routerLinkActive="active">
                    <a routerLink="/clients">
                        <mat-icon aria-hidden="true">people</mat-icon>
                        <span>Clientes</span>
                    </a>
                </li>
            </ul>
            <ul class="sidebar-links bottom-links">
                <li><a href="#"><mat-icon aria-hidden="true">settings</mat-icon>
                <span>Configuración</span></a></li>
            </ul>
        </div>
    </aside>
</div>

<div class="topbar">
    <div class="user-info">
        <span class="user-email">{{ userName() }}</span>
        <span class="user-role">{{ userRole() }}</span>
    </div>
    <span id="clock" class="topbar-clock">{{ currentTime() }}</span>
    <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
        <mat-icon>logout</mat-icon>
    </button>
</div>
