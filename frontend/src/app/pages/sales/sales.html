<div><app-navbar></app-navbar></div>

<main class="contenido">

  <div class="view-header">
    <h2>Ventas</h2>
  </div>

  <div class="search-row">
    <input type="text" placeholder="Buscar por cliente o método de pago…"
           [(ngModel)]="searchTerm">
  </div>

  <div class="card table-scroll">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Fecha</th><th>Cliente</th>
          <th>Método de pago</th><th class="num">Total</th>
        </tr>
      </thead>
      <tbody>
        @for (venta of filteredVentas; track venta.id) {
          <tr>
            <td>{{ venta.id }}</td>
            <td>{{ venta.date | date:'dd/MM/yyyy HH:mm' }}</td>
            <td><strong>{{ getCliente(venta) }}</strong></td>
            <td>{{ getMetodoPago(venta.paymentMethod) }}</td>
            <td class="num">{{ venta.total | currency:'ARS':'symbol-narrow':'1.0-0' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

</main>
