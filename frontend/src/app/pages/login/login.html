<div class="login-page">
  <div class="login-branding">
    <div class="branding-content">
      <img class="branding-logo" src="logo.png" alt="Fuente Lac" />
      <h1>Fuente Lac</h1>
      <p>Sistema de gestión de stock y producción</p>
    </div>
  </div>

  <div class="login-form-panel">
    <mat-card class="login-card">
      <mat-card-content>
        <div class="login-header">
          <img class="login-icon" src="logo.png" alt="Fuente Lac" />
          <h3>Iniciar sesión</h3>
        </div>

        @if (error) {
          <div class="login-error">
            <mat-icon>error_outline</mat-icon>
            <span>{{ error }}</span>
          </div>
        }

        <form (ngSubmit)="submit()" #form="ngForm">
          <mat-form-field appearance="outline" class="full-width stagger-1">
            <mat-label>Email</mat-label>
            <input id="email" matInput type="email" [(ngModel)]="email" name="email" required email
                   placeholder="ejemplo@correo.com" />
            <mat-icon matPrefix>email</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width stagger-2">
            <mat-label>Contraseña</mat-label>
            <input id="password" matInput
                   [type]="showPassword() ? 'text' : 'password'"
                   [(ngModel)]="password" name="password" required
                   placeholder="••••••••" />
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button" class="password-toggle" (click)="togglePassword()"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit"
                  class="full-width login-btn stagger-3" [disabled]="form.invalid || loading()">
            @if (loading()) {
              <mat-spinner diameter="20" class="btn-spinner"></mat-spinner>
            }
            Ingresar
          </button>
        </form>

        <div class="login-footer stagger-3">
          <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
