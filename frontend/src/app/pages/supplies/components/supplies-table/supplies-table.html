  <div class="mat-elevation-z2 table-container">
    <table mat-table [dataSource]="supplies()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Insumo</th>
        <td mat-cell *matCellDef="let row"><strong>{{ row.name }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="supplier">
        <th mat-header-cell *matHeaderCellDef>Proveedor</th>
        <td mat-cell *matCellDef="let row">{{ row.supplier?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="currentStock">
        <th mat-header-cell *matHeaderCellDef class="num">Stock actual</th>
        <td mat-cell *matCellDef="let row" class="num">
          <div class="stock-cell">
            <div class="stockbar">
              <div class="stockbar-fill" [style.width.%]="getStockPercent(row)"
                   [style.background]="getEstado(row).color"></div>
            </div>
            <span class="stock-num">{{ row.currentStock | number }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="minStock">
        <th mat-header-cell *matHeaderCellDef class="num">Stock mínimo</th>
        <td mat-cell *matCellDef="let row" class="num">{{ row.minStock | number }}</td>
      </ng-container>

      <ng-container matColumnDef="costPrice">
        <th mat-header-cell *matHeaderCellDef class="num">Precio unit.</th>
        <td mat-cell *matCellDef="let row" class="num">{{ row.costPrice | currency:'ARS':'symbol-narrow':'1.0-0' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="status-col">Estado</th>
        <td mat-cell *matCellDef="let row" class="status-col">
          <span class="chip-status" [ngClass]="getEstado(row).chipClass">
            {{ getEstado(row).label }}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
