@if (orders().length === 0) {
  <div class="empty-state">
    <mat-icon>local_shipping</mat-icon>
    <div class="empty-state-title">Sin pedidos</div>
    <div class="empty-state-sub">Todavía no registraste ningún pedido a proveedores.</div>
  </div>
} @else {
  <div class="orders-wrapper">
    @for (order of orders(); track order.id) {
      <app-order-card [order]="order" (changed)="changed.emit()"></app-order-card>
    }
  </div>
}
