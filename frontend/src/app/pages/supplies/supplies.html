<div><app-navbar></app-navbar></div>

<main class="contenido">

  <div class="view-header view-header-row">
    <h2>Insumos</h2>
    <button mat-raised-button color="white" routerLink="/supplies/order">
      <mat-icon>add</mat-icon> Registrar pedido
    </button>
  </div>

  @if (errorMessage()) {
    <div class="supplies-error">{{ errorMessage() }}</div>
  }

  <mat-tab-group>
    <mat-tab label="Insumos">
      <app-supplies-table [supplies]="insumos()"></app-supplies-table>
    </mat-tab>
    <mat-tab label="Pedidos">
      <app-orders-list [orders]="pedidos()" (changed)="cargarTodo()"></app-orders-list>
    </mat-tab>
  </mat-tab-group>

</main>
