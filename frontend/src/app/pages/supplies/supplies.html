<div><app-navbar></app-navbar></div>

<main class="contenido">

  <div class="view-header view-header-row">
    <h2>Insumos</h2>
    <button mat-raised-button color="white" routerLink="/supplies/order">
      <mat-icon>add</mat-icon> Registrar pedido
    </button>
  </div>

  <mat-tab-group>
    <mat-tab label="Insumos">
      <app-supplies-table [supplies]="insumos()"></app-supplies-table>
    </mat-tab>
    <mat-tab label="Pedidos">
      <div class="empty-state">
        <mat-icon>local_shipping</mat-icon>
        <div class="empty-state-title">Sin pedidos</div>
        <div class="empty-state-sub">Todavía no registraste ningún pedido a proveedores.</div>
      </div>
    </mat-tab>
  </mat-tab-group>

</main>
