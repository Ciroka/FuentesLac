<div><app-navbar></app-navbar></div>

<main class="contenido">

  <div class="view-header">
    <h2>Clientes</h2>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar cliente</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Nombre, CUIT o email...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  @if (filteredClientes.length === 0) {
    <div class="empty-state">
      <mat-icon>search_off</mat-icon>
      <div class="empty-state-title">Sin resultados</div>
      <div class="empty-state-sub">No hay clientes que coincidan con la búsqueda.</div>
    </div>
  } @else {
  <div class="mat-elevation-z2 table-container">
    <table mat-table [dataSource]="filteredClientes">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c"><strong>{{ c.name }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Apellido</th>
        <td mat-cell *matCellDef="let c">{{ c.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let c">{{ c.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="cuit">
        <th mat-header-cell *matHeaderCellDef>CUIT</th>
        <td mat-cell *matCellDef="let c">{{ c.cuit }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let c">{{ c.email }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  }

</main>
