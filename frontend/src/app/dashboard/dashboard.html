<app-navbar></app-navbar>
<main class="contenido page-enter">

  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="36"></mat-spinner>
      <p>Cargando resumen del día...</p>
    </div>
  }

  @if (error()) {
    <mat-card class="error-state">
      <mat-icon>error_outline</mat-icon>
      <p>{{ error() }}</p>
      <button mat-raised-button color="primary" (click)="ngOnInit()">
        <mat-icon>refresh</mat-icon> Reintentar
      </button>
    </mat-card>
  }

  @if (summary(); as s) {

    <div class="grid grid-4 stagger-grid">
      <app-kpi-card
        label="Producción hoy"
        [value]="s.todayProduction.totalQuantity + ' u'"
        [delta]="s.todayProduction.totalQuantity === 0 && s.todayProduction.vsYesterday === 0 ? undefined : s.todayProduction.vsYesterday"
        deltaLabel="vs ayer"
        icon="apartment"
        [noActivity]="s.todayProduction.totalQuantity === 0 && s.todayProduction.vsYesterday === 0"
        [ariaLabel]="'Producción hoy: ' + s.todayProduction.totalQuantity + ' unidades'"
      ></app-kpi-card>
      <app-kpi-card
        label="Ventas hoy"
        [value]="formatCurrency(s.todaySales.totalAmount)"
        [suffix]="'/' + s.todaySales.totalUnits + ' u'"
        [delta]="s.todaySales.totalUnits === 0 && s.todaySales.vsYesterday === 0 ? undefined : s.todaySales.vsYesterday"
        deltaLabel="vs ayer"
        icon="trending_up"
        [noActivity]="s.todaySales.totalUnits === 0 && s.todaySales.vsYesterday === 0"
        [ariaLabel]="'Ventas hoy: ' + formatCurrency(s.todaySales.totalAmount) + ', ' + s.todaySales.totalUnits + ' unidades'"
      ></app-kpi-card>
      <app-kpi-card
        label="Stock producido"
        [value]="s.productionVsSales.balance > 0 ? '+' + s.productionVsSales.balance + ' u' : s.productionVsSales.balance + ' u'"
        [valueClass]="s.productionVsSales.balance > 0 ? 'up' : s.productionVsSales.balance < 0 ? 'down' : ''"
        deltaLabel="producido vs vendido"
        icon="inventory_2"
        [noActivity]="s.productionVsSales.produced === 0 && s.productionVsSales.sold === 0"
        [ariaLabel]="'Stock producido: balance ' + s.productionVsSales.balance + ' unidades'"
      ></app-kpi-card>
      <app-kpi-card
        label="Insumos bajo mín."
        [value]="s.criticalSupplies.length.toString()"
        [valueClass]="s.criticalSupplies.length > 0 ? 'down' : 'up'"
        [suffix]="s.criticalSupplies.length === 0 ? ' OK' : ' alerta'"
        [deltaLabel]="s.criticalSupplies.length > 0 ? 'requieren reposición' : 'stock al día'"
        icon="water_drop"
        [ariaLabel]="'Insumos bajo mínimo: ' + s.criticalSupplies.length"
      ></app-kpi-card>
    </div>

    <div class="grid grid-2">
      <mat-card>
        <mat-card-content>
          <div class="section-header">
            <div class="section-label">Acciones sugeridas</div>
          </div>
          <app-action-list [actions]="s.suggestedActions"></app-action-list>
        </mat-card-content>
      </mat-card>

      <mat-card class="chart-card">
        <mat-card-content>
          <div class="section-header">
            <div class="section-label">Producción semanal</div>
          </div>
          <app-weekly-chart [days]="s.weeklyProduction"></app-weekly-chart>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="grid grid-2">
      <mat-card>
        <mat-card-content>
          <div class="section-header">
            <div class="section-label">Stock de productos</div>
          </div>
          <app-product-stock-bars [products]="s.productStocks"></app-product-stock-bars>
        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-content>
          <div class="section-header">
            <div class="section-label">Más vendidos hoy</div>
          </div>
          <app-top-selling-list [products]="s.todaySales.topProducts"></app-top-selling-list>
        </mat-card-content>
      </mat-card>
    </div>

  }

</main>
